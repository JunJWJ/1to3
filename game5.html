<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饗要你手速 - 8.00 秒極限挑戰</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --gold: #f39c12;
      --gold-light: #f1c40f;
      --gold-glow: rgba(243, 156, 18, 0.4);
      --text-main: #ffffff;
      --text-sub: #a0a0a8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* 頂部標題 */
    header {
      text-align: center;
      margin-top: 10px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 30%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* 碼表核心顯示區 */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    .timer-display {
      font-family: "Courier New", Courier, monospace;
      font-size: 4.8rem;
      font-weight: bold;
      color: var(--gold-light);
      text-shadow: 0 0 20px var(--gold-glow);
      letter-spacing: 2px;
      min-width: 260px;
      text-align: center;
    }

    .hint-text {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* 核心主按鈕 (圓形饗字) */
    .button-container {
      margin: 20px 0;
    }

    .action-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      background: radial-gradient(circle at 30% 30%, #2c2c36, #141418);
      color: var(--gold-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px rgba(0,0,0,0.8);
      transition: transform 0.1s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      outline: none;
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    .action-btn .icon-text {
      font-size: 3.2rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 10px var(--gold-glow);
    }

    .action-btn .btn-status {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 4px;
      color: #fff;
    }

    /* 運行狀態的動態發光效果 */
    .action-btn.running {
      border-color: #ff4757;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.6);
      animation: pulse 1.2s infinite;
    }

    .action-btn.running .icon-text {
      color: #ff4757;
      text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* 挑戰規則面板 */
    .rule-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    .rule-card h3 {
      font-size: 0.95rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .rule-prize {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.6;
    }

    .rule-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* 結果結算彈窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-score {
      font-family: "Courier New", Courier, monospace;
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--gold-light);
      margin: 8px 0;
    }

    .modal-diff {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .modal-reward {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      color: #121214;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn:hover {
      background: var(--gold-light);
    }
  </style>
</head>
<body>

  <!-- 頂部資訊 -->
  <header>
    <h1>饗要你手速</h1>
    <p>唯一目標 8.00 秒 · 考驗神手反應</p>
  </header>

  <!-- 碼表區 -->
  <div class="timer-container">
    <div class="timer-display" id="display">0.00</div>
    <div class="hint-text" id="statusHint">點擊下方「饗」按鈕開始計時</div>
  </div>

  <!-- 按鈕區 -->
  <div class="button-container">
    <button class="action-btn" id="actionBtn">
      <span class="icon-text">饗</span>
      <span class="btn-status" id="btnLabel">START</span>
    </button>
  </div>

  <!-- 挑戰規則面板 -->
  <div class="rule-card">
    <h3>🎯 挑戰目標：精準 8.00 秒</h3>
    <div class="rule-prize">
      套餐抵用券<br>＋ 研究材料兌換券 1 張
    </div>
    <div class="rule-desc">僅限精確停在 8.00 秒方可獲得獎項</div>
  </div>

  <!-- 結果結算彈窗 -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <p style="font-size: 0.9rem; color: var(--text-sub);">你的成績</p>
      <div class="modal-score" id="resultScore">0.00</div>
      <div class="modal-diff" id="resultDiff">誤差 0.00 秒</div>
      <div class="modal-reward" id="resultReward"></div>
      <button class="modal-btn" id="confirmBtn">再試一次</button>
    </div>
  </div>

  <script>
    const TARGET_TIME = 8.00;
    let startTime = 0;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById("display");
    const statusHint = document.getElementById("statusHint");
    const actionBtn = document.getElementById("actionBtn");
    const btnLabel = document.getElementById("btnLabel");

    const modal = document.getElementById("resultModal");
    const resultScore = document.getElementById("resultScore");
    const resultDiff = document.getElementById("resultDiff");
    const resultReward = document.getElementById("resultReward");
    const confirmBtn = document.getElementById("confirmBtn");

    function formatTime(seconds) {
      return seconds.toFixed(2);
    }

    function updateTimer() {
      const elapsed = (performance.now() - startTime) / 1000;
      display.textContent = formatTime(elapsed);
    }

    function startTimer() {
      isRunning = true;
      startTime = performance.now();
      display.textContent = "0.00";
      
      btnLabel.textContent = "STOP";
      actionBtn.classList.add("running");
      statusHint.textContent = "瞄準 8.00 秒再次按下！";

      timerInterval = setInterval(updateTimer, 10);
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      
      const finalTime = (performance.now() - startTime) / 1000;
      display.textContent = formatTime(finalTime);

      btnLabel.textContent = "START";
      actionBtn.classList.remove("running");
      statusHint.textContent = "挑戰結束！";

      evaluateResult(finalTime);
    }

    function evaluateResult(score) {
      const diff = Math.abs(score - TARGET_TIME);
      const roundedDiff = Math.round(diff * 100) / 100;

      let rewardContent = "";

      if (roundedDiff === 0.00) {
        rewardContent = "🎉【神手命中 8.00 秒！】<br><span style='color: var(--gold-light);'>套餐抵用券</span><br>＋<br><span style='color: var(--gold-light);'>研究材料兌換券一張</span>";
      } else {
        rewardContent = "<span style='color: #a0a0a8; font-size: 1.05rem;'>很可惜！挑戰失敗</span><br><span style='font-size: 0.9rem; color: #777;'>再接再厲，下次一定中！</span>";
      }

      resultScore.textContent = formatTime(score);
      resultDiff.textContent = `與 8.00 秒相差 ${roundedDiff.toFixed(2)} 秒`;
      resultReward.innerHTML = rewardContent;

      setTimeout(() => {
        modal.classList.add("active");
      }, 200);
    }

    actionBtn.addEventListener("click", () => {
      if (!isRunning) {
        startTimer();
      } else {
        stopTimer();
      }
    });

    confirmBtn.addEventListener("click", () => {
      modal.classList.remove("active");
      statusHint.textContent = "點擊下方「饗」按鈕開始計時";
    });
  </script>
</body>
</html>
